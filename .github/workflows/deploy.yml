name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          npm install opennextjs-cloudflare @opennextjs/cloudflare

      - name: Inject OAuth secrets into wrangler.jsonc
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('wrangler.jsonc', 'utf8');
          content = content.replace(/"GOOGLE_CLIENT_ID"\s*:\s*"[^"]*"/, '"GOOGLE_CLIENT_ID": \"' + process.env.GOOGLE_CLIENT_ID + '\"');
          content = content.replace(/"GOOGLE_CLIENT_SECRET"\s*:\s*"[^"]*"/, '"GOOGLE_CLIENT_SECRET": \"' + process.env.GOOGLE_CLIENT_SECRET + '\"');
          fs.writeFileSync('wrangler.jsonc', content);
          console.log('Updated wrangler.jsonc');
          "

      - name: Build and Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
