name: Image Background Remover - Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  DEPLOY_REGION: 'auto'
  WORKER_NAME: ${{ vars.WORKER_NAME || 'image-background-remover' }}

jobs:
  # ============================================================
  # Job 1: 代码质量检查
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  # ============================================================
  # Job 2: 构建测试
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}

  # ============================================================
  # Job 3: 部署到 Cloudflare Workers
  # ============================================================
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ---------- 安装依赖 ----------
      - name: Install dependencies
        run: |
          npm ci
          npm install opennextjs-cloudflare@latest @opennextjs/cloudflare@latest

      # ---------- 部署前：验证密钥（catch 问题在 build 之前） ----------
      - name: Validate secrets before build
        run: node scripts/validate-secrets.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}

      # ---------- 注入 Secrets 到 wrangler.jsonc（build 之前执行） ----------
      - name: Patch wrangler config with secrets
        run: node patch.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}

      # ---------- 验证 Cloudflare 凭证 ----------
      - name: Verify Cloudflare credentials
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ---------- 构建 + 部署 ----------
      - name: Build and Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}

      # ---------- 部署后健康检查 ----------
      - name: Health check after deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.WORKER_NAME }}.xiadieliuying.workers.dev)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is up! HTTP $HTTP_CODE"
          else
            echo "⚠️  Site returned HTTP $HTTP_CODE (may be expected for API-only worker)"
          fi

      # ---------- API 冒烟测试 ----------
      - name: Smoke test API endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://${{ env.WORKER_NAME }}.xiadieliuying.workers.dev/api/remove \
            -H "Content-Type: application/json" \
            -d '{}')
          # 401 = not authenticated (expected), 200 = working, 405 = method not allowed (expected for GET /)
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "405" ]; then
            echo "✅ API endpoint responding correctly (HTTP $HTTP_CODE)"
          else
            echo "⚠️  API returned HTTP $HTTP_CODE"
          fi

  # ============================================================
  # Job 4: 更新部署状态
  # ============================================================
  status:
    name: Update deployment status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Record deployment
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ Deployment completed successfully"
            echo "🔗 https://${{ env.WORKER_NAME }}.xiadieliuying.workers.dev"
          else
            echo "❌ Deployment failed"
            exit 1
          fi